# --- HOW TO SET UP (2 minutes) ---
#
# 1. Go to https://supabase.com and create a free account
# 2. Create a new project (pick any name and password)
# 3. Go to Settings > Database
# 4. Under "Connection string" > "URI", copy the connection string
# 5. Replace [YOUR-PASSWORD] in the string with your database password
#
# 6. For local dev:  copy this file to secrets.toml and fill in the URL
#    For Streamlit Cloud:  paste this into app settings > Secrets

database_url = "postgresql://postgres.xxxx:YOUR-PASSWORD@aws-0-eu-central-1.pooler.supabase.com:6543/postgres"
