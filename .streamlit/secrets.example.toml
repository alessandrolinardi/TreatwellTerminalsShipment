# --- HOW TO SET UP ---
#
# 1. Go to https://console.cloud.google.com/
# 2. Create a project (or use an existing one)
# 3. Enable the "Google Sheets API" and "Google Drive API"
# 4. Go to "Credentials" > "Create Credentials" > "Service Account"
# 5. Name it (e.g. "streamlit-shipments") and click through
# 6. On the service account page, go to "Keys" > "Add Key" > "Create new key" > JSON
# 7. Open the downloaded JSON file — copy the values below
#
# 8. Create a Google Sheet and share it with the service account email
#    (the "client_email" value below) — give it "Editor" access
# 9. Copy the spreadsheet ID from the URL:
#    https://docs.google.com/spreadsheets/d/<THIS_IS_THE_ID>/edit
#
# 10. For local dev:  copy this file to secrets.toml and fill in values
#     For Streamlit Cloud:  paste these into the app settings > Secrets

spreadsheet_id = "YOUR_SPREADSHEET_ID_HERE"

[gcp_service_account]
type = "service_account"
project_id = "your-project-id"
private_key_id = "key-id"
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project.iam.gserviceaccount.com"
client_id = "123456789"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com"
