# --- HOW TO SET UP (2 minutes) ---
#
# 1. Go to https://supabase.com and create a free account
# 2. Create a new project (pick any name and password)
# 3. Go to Settings > API
# 4. Copy the "Project URL" → supabase_url below
# 5. Copy the "service_role" secret key → supabase_key below
#    (NOT the anon key — service role is needed for backend access)
#
# 6. Run the migration to create tables:
#    psql "$DATABASE_URL" -f supabase/migrations/001_initial.sql
#
# 7. For local dev:  copy this file to secrets.toml and fill in the values
#    For Streamlit Cloud:  paste into app settings > Secrets

supabase_url = "https://your-project.supabase.co"
supabase_key = "eyJ..."
