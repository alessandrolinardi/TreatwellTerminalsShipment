<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treatwell Terminal Shipment Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Treatwell Terminal Shipments</h1>
    <p class="subtitle">Track terminal shipments to venues</p>
  </header>

  <main>
    <!-- Filter bar -->
    <div class="toolbar">
      <div class="filters">
        <label>Filter by status:</label>
        <select id="statusFilter">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="label_created">Label Created</option>
          <option value="picked_up">Picked Up</option>
          <option value="in_transit">In Transit</option>
          <option value="delivered">Delivered</option>
          <option value="issue">Issue</option>
        </select>
      </div>
      <button id="btnNewShipment" class="btn btn-primary">+ New Shipment</button>
    </div>

    <!-- Shipments table -->
    <div class="table-container">
      <table id="shipmentsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Venue ID</th>
            <th>Supplier ID</th>
            <th>Address</th>
            <th>Serial #</th>
            <th>Tracking #</th>
            <th>Carrier</th>
            <th>Status</th>
            <th>Assigned To</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="shipmentsBody">
        </tbody>
      </table>
      <p id="emptyState" class="empty-state" style="display:none;">No shipments found. Click "+ New Shipment" to create one.</p>
    </div>
  </main>

  <!-- Modal: New Shipment -->
  <div id="modalNewShipment" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>New Shipment Request</h2>
        <button class="modal-close" onclick="closeModal('modalNewShipment')">&times;</button>
      </div>
      <form id="formNewShipment">
        <div class="form-group">
          <label for="newVenueId">Venue ID *</label>
          <input type="text" id="newVenueId" required placeholder="e.g. 12345">
        </div>
        <div class="form-group">
          <label for="newSupplierId">Supplier ID *</label>
          <input type="text" id="newSupplierId" required placeholder="e.g. SUP-001">
        </div>
        <div class="form-group">
          <label for="newAddress">Shipping Address *</label>
          <textarea id="newAddress" required placeholder="Full shipping address"></textarea>
        </div>
        <div class="form-group">
          <label for="newContactName">Contact Name</label>
          <input type="text" id="newContactName" placeholder="Venue contact person">
        </div>
        <div class="form-group">
          <label for="newCreatedBy">Created By</label>
          <input type="text" id="newCreatedBy" value="Ale" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="newNotes">Notes</label>
          <textarea id="newNotes" placeholder="Any extra info..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modalNewShipment')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Shipment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Edit / Update Shipment -->
  <div id="modalEditShipment" class="modal" style="display:none;">
    <div class="modal-content modal-wide">
      <div class="modal-header">
        <h2>Shipment #<span id="editShipmentId"></span></h2>
        <button class="modal-close" onclick="closeModal('modalEditShipment')">&times;</button>
      </div>
      <form id="formEditShipment">
        <div class="form-row">
          <div class="form-group">
            <label for="editVenueId">Venue ID</label>
            <input type="text" id="editVenueId">
          </div>
          <div class="form-group">
            <label for="editSupplierId">Supplier ID</label>
            <input type="text" id="editSupplierId">
          </div>
        </div>
        <div class="form-group">
          <label for="editAddress">Shipping Address</label>
          <textarea id="editAddress"></textarea>
        </div>
        <div class="form-group">
          <label for="editContactName">Contact Name</label>
          <input type="text" id="editContactName">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editSerialNumber">Serial Number</label>
            <input type="text" id="editSerialNumber" placeholder="Terminal serial #">
          </div>
          <div class="form-group">
            <label for="editTrackingNumber">Tracking Number</label>
            <input type="text" id="editTrackingNumber" placeholder="Courier tracking #">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editCarrier">Carrier</label>
            <input type="text" id="editCarrier" placeholder="e.g. DHL, UPS, GLS...">
          </div>
          <div class="form-group">
            <label for="editAssignedTo">Assigned To</label>
            <input type="text" id="editAssignedTo" placeholder="Employee handling this">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editStatus">Status</label>
            <select id="editStatus">
              <option value="pending">Pending</option>
              <option value="label_created">Label Created</option>
              <option value="picked_up">Picked Up</option>
              <option value="in_transit">In Transit</option>
              <option value="delivered">Delivered</option>
              <option value="issue">Issue</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editChangedBy">Updated By</label>
            <input type="text" id="editChangedBy" placeholder="Your name">
          </div>
        </div>
        <div class="form-group">
          <label for="editNotes">Notes</label>
          <textarea id="editNotes"></textarea>
        </div>
        <div class="form-group">
          <label for="editStatusNote">Status Update Note</label>
          <input type="text" id="editStatusNote" placeholder="Reason for status change">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-danger" id="btnDeleteShipment">Delete</button>
          <div>
            <button type="button" class="btn btn-secondary" onclick="closeModal('modalEditShipment')">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </div>
      </form>

      <!-- Status History -->
      <div class="history-section">
        <h3>Status History</h3>
        <div id="statusHistory"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
